name: Checks and macOS downloads
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e 'const { version } = require("./package.json"); if (process.env.RELEASE_TAG !== `v${version}`) throw new Error("Version tag must match package.json");'
      - run: npm run check
      - run: npm audit --audit-level=high
  package:
    name: macOS download (${{ matrix.arch }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    runs-on: macos-latest
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # This profile uses only ad-hoc signing, with no certificate or signing secret.
      CSC_FOR_PULL_REQUEST: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package DMG and ZIP
        run: npx --no-install electron-builder --config electron-builder.ci.yml --mac dmg zip --${{ matrix.arch }} --publish never
      - name: Verify signature and executable architecture
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          app=$(find dist -maxdepth 2 -name '*.app' -type d -print -quit)
          test -n "$app"
          codesign --verify --deep --strict "$app"
          expected="$BUILD_ARCH"
          if [ "$BUILD_ARCH" = x64 ]; then expected=x86_64; fi
          lipo -verify_arch "$expected" "$app/Contents/MacOS/Newsletter Unsubscriber"
      - name: Checksums
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          cd dist
          shasum -a 256 ./*.dmg ./*.zip > "SHA256SUMS-mac-$BUILD_ARCH.txt"
      - name: Upload downloads
        id: downloads
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: newsletter-macos-${{ matrix.arch }}-${{ github.sha }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS-mac-*.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Link downloads in run summary
        env:
          DOWNLOAD_URL: ${{ steps.downloads.outputs.artifact-url }}
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          printf '### macOS %s\n\n[Download DMG, ZIP and checksums](%s)\n\nAd-hoc signed; not Apple notarized. Microsoft sign-in requires your own app registration.\n' "$BUILD_ARCH" "$DOWNLOAD_URL" >> "$GITHUB_STEP_SUMMARY"
  release:
    name: Publish version downloads
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [check, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify version belongs to the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: newsletter-macos-*
          path: release-assets
          merge-multiple: true
      - name: Publish release after both architectures succeed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json; then
            if [ "$(jq -r .isDraft release-state.json)" = false ]; then
              echo 'This version is already published; retaining its existing downloads.'
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "$RELEASE_TAG" --notes-file docs/DOWNLOADS.md
          fi
          gh release upload "$RELEASE_TAG" release-assets/*.dmg release-assets/*.zip release-assets/SHA256SUMS-mac-*.txt --clobber
          prerelease=false
          latest=true
          if [[ "$RELEASE_TAG" == *-* ]]; then prerelease=true; latest=false; fi
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$prerelease" --latest="$latest"
